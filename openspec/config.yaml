schema: spec-driven
context: |
  Greenfield Music Maker Multiplayer, planned here before template import.
  User authorized artifact updates, implementation, repository creation, releases and deployment.
  Up to four humans; host may play alone. Eight repeating steps at 500 ms each.
  Four instruments: kick, snare, hi-hat and synth tone. Each distinct sound queues
  once for the next step and plays once locally; every remote listener hears that
  event three seconds after its source deadline, including host listening to guest.
  Relay-only Colyseus backend; host browser owns musical simulation.
  Required repository template, shared skills library, Babylon Lite pixel-perfect
  2D landscape presentation. No inherited dungeon or combat mechanics.
  Host loss ends the session; cancel audio and offer create/join again. All players share a live cursor plus a remote source-step marker.
  Preserve planning files during template import and follow default-branch policy.

